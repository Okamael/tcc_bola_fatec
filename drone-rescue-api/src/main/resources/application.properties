# Aplicação alvo sintética — porta 7070 (evita conflito com crAPI:8888 e VAmPI:5001)
server.port=7070

# Banco H2 em memória — zero setup, recriado a cada boot
spring.datasource.url=jdbc:h2:mem:dronedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Console H2 opcional para inspeção manual (http://localhost:7070/h2-console)
spring.h2.console.enabled=true
